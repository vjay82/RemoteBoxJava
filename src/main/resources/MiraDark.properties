# =============================================================================
# Mira Dark — custom FlatLaf theme for autoMATE
#
# Loaded by FlatPropertiesLaf via Resources.class.getResourceAsStream(
#   "MiraDark.properties"). Inherits from FlatDarkLaf.
#
# Color philosophy:
#   - Near-black charcoal background (#1E1F22) inspired by VS Code Dark+
#   - Slightly lighter panels (#2B2D30) for elevation
#   - NTT-style blue accent (#1E5BC6) for selection / focus
#   - High-contrast off-white text (#E6E6E6)
# =============================================================================

# Inherit defaults from FlatDarkLaf
@baseTheme = dark

# ---- Color palette (referenced via @key syntax) ----
@background        = #1E1F22
@foreground        = #E6E6E6
@disabledForeground = #6F7174
@selectionBackground = #1E5BC6
@selectionForeground = #FFFFFF
@accentColor       = #1E5BC6
@accentFocusColor  = #4A86E8
@panelBackground   = #2B2D30
@elevatedBackground = #313438
@borderColor       = #3C3F44
@hoverBackground   = #2F3338
@pressedBackground = #26292D
@errorColor        = #E55353
@warningColor      = #E5A11E
@successColor      = #5CB85C

# ---- Global ----
control            = @panelBackground
controlText        = @foreground
text               = @foreground
textText           = @foreground
window             = @background
windowText         = @foreground
nimbusBase         = @accentColor
nimbusFocus        = @accentFocusColor
nimbusSelectionBackground = @selectionBackground

Component.accentColor       = @accentColor
Component.focusColor        = @accentFocusColor
Component.focusedBorderColor = @accentColor
Component.borderColor       = @borderColor
Component.disabledBorderColor = @borderColor
Component.innerFocusWidth   = 1
Component.arc               = 6
Component.focusWidth        = 1

# ---- Panel / container ----
Panel.background            = @background
Viewport.background         = @background
RootPane.background         = @background
# SplitPane: give the divider a clearly visible contrasting color so users can
# see the boundary between the function tree (left) and the settings (right).
SplitPane.background           = @borderColor
SplitPane.foreground           = @borderColor
SplitPane.dividerSize          = 6
SplitPane.background.dark      = @borderColor
SplitPaneDivider.draggingColor = @accentColor
SplitPaneDivider.gripColor     = @foreground
SplitPaneDivider.gripDotCount  = 3
SplitPaneDivider.style         = grip

# ---- Buttons ----
Button.background           = @panelBackground
Button.foreground           = @foreground
Button.hoverBackground      = @hoverBackground
Button.pressedBackground    = @pressedBackground
Button.focusedBackground    = @panelBackground
Button.borderColor          = @borderColor
Button.focusedBorderColor   = @accentColor
Button.default.background   = @accentColor
Button.default.foreground   = #FFFFFF
Button.default.hoverBackground = @accentFocusColor
Button.default.pressedBackground = #1A4FAF
Button.default.focusedBorderColor = @accentFocusColor
Button.default.borderColor  = @accentColor
Button.arc                  = 6

ToggleButton.background     = @panelBackground
ToggleButton.selectedBackground = @accentColor
ToggleButton.selectedForeground = #FFFFFF

# ---- Text components ----
TextField.background        = @elevatedBackground
TextField.foreground        = @foreground
TextField.caretForeground   = @foreground
TextField.selectionBackground = @selectionBackground
TextField.selectionForeground = @selectionForeground
TextField.placeholderForeground = @disabledForeground
TextField.inactiveForeground = @disabledForeground
TextField.borderColor       = @borderColor
TextField.focusedBorderColor = @accentColor
TextField.disabledBackground = @panelBackground

FormattedTextField.background = @elevatedBackground
PasswordField.background    = @elevatedBackground
TextArea.background         = @elevatedBackground
TextArea.foreground         = @foreground
TextArea.caretForeground    = @foreground
TextArea.selectionBackground = @selectionBackground
TextArea.selectionForeground = @selectionForeground
TextPane.background         = @elevatedBackground
TextPane.foreground         = @foreground
EditorPane.background       = @elevatedBackground
EditorPane.foreground       = @foreground

# ---- Combo box / spinner ----
ComboBox.background         = @elevatedBackground
ComboBox.foreground         = @foreground
ComboBox.buttonBackground   = @panelBackground
ComboBox.buttonArrowColor   = @foreground
ComboBox.buttonHoverArrowColor = @accentFocusColor
ComboBox.selectionBackground = @selectionBackground
ComboBox.selectionForeground = @selectionForeground
ComboBox.popupBackground    = @panelBackground

Spinner.background          = @elevatedBackground
Spinner.foreground          = @foreground
Spinner.buttonBackground    = @panelBackground
Spinner.buttonArrowColor    = @foreground

# ---- Lists / tables / trees ----
List.background             = @background
List.foreground             = @foreground
List.selectionBackground    = @selectionBackground
List.selectionForeground    = @selectionForeground
List.selectionInactiveBackground = #2D436E
List.selectionInactiveForeground = @foreground
List.hoverBackground        = @hoverBackground

Table.background            = @background
Table.foreground            = @foreground
Table.gridColor             = @borderColor
Table.selectionBackground   = @selectionBackground
Table.selectionForeground   = @selectionForeground
Table.selectionInactiveBackground = #2D436E
Table.selectionInactiveForeground = @foreground
Table.alternateRowColor     = @background
Table.hoverBackground       = @hoverBackground

TableHeader.background      = @panelBackground
TableHeader.foreground      = @foreground
TableHeader.separatorColor  = @borderColor
TableHeader.bottomSeparatorColor = @borderColor

Tree.background             = @background
Tree.foreground             = @foreground
Tree.selectionBackground    = @selectionBackground
Tree.selectionForeground    = @selectionForeground
Tree.selectionInactiveBackground = #2D436E
Tree.hoverBackground        = @hoverBackground

# ---- Tabs ----
TabbedPane.background           = @background
TabbedPane.foreground           = @foreground
TabbedPane.disabledForeground   = @disabledForeground
TabbedPane.selectedBackground   = @background
TabbedPane.selectedForeground   = #FFFFFF
TabbedPane.hoverColor           = @hoverBackground
TabbedPane.focusColor           = @accentColor
TabbedPane.underlineColor       = @accentColor
TabbedPane.inactiveUnderlineColor = #5A5C60
TabbedPane.disabledUnderlineColor = @borderColor
TabbedPane.contentAreaColor     = @background
TabbedPane.tabSeparatorColor    = @background
TabbedPane.tabAreaBackground    = @background
TabbedPane.closeHoverBackground = @hoverBackground
TabbedPane.closePressedBackground = @pressedBackground
TabbedPane.tabSelectionHeight   = 3

# ---- Menus / popups ----
MenuBar.background          = @panelBackground
MenuBar.foreground          = @foreground
MenuBar.borderColor         = @borderColor
Menu.background             = @panelBackground
Menu.foreground             = @foreground
Menu.selectionBackground    = @selectionBackground
Menu.selectionForeground    = @selectionForeground
MenuItem.background         = @panelBackground
MenuItem.foreground         = @foreground
MenuItem.selectionBackground = @selectionBackground
MenuItem.selectionForeground = @selectionForeground
MenuItem.acceleratorForeground = @disabledForeground
PopupMenu.background        = @panelBackground
PopupMenu.foreground        = @foreground
PopupMenu.borderColor       = @borderColor

CheckBoxMenuItem.background = @panelBackground
CheckBoxMenuItem.foreground = @foreground
CheckBoxMenuItem.selectionBackground = @selectionBackground
CheckBoxMenuItem.selectionForeground = @selectionForeground
RadioButtonMenuItem.background = @panelBackground
RadioButtonMenuItem.foreground = @foreground
RadioButtonMenuItem.selectionBackground = @selectionBackground

# ---- Tooltip ----
ToolTip.background          = @elevatedBackground
ToolTip.foreground          = @foreground
ToolTip.borderColor         = @borderColor

# ---- Scrollbars ----
ScrollBar.background        = @background
ScrollBar.track             = @background
ScrollBar.thumb             = #4A4D52
ScrollBar.hoverThumbColor   = #5C6066
ScrollBar.pressedThumbColor = @accentColor
ScrollBar.width             = 12

# ---- Progress bar ----
ProgressBar.background      = @panelBackground
ProgressBar.foreground      = @accentColor
ProgressBar.selectionBackground = @foreground
ProgressBar.selectionForeground = @background

# ---- Separators / borders ----
Separator.foreground        = @borderColor
Separator.background        = @borderColor
TitledBorder.titleColor     = @foreground

# ---- Dialogs / option pane ----
OptionPane.background       = @background
OptionPane.foreground       = @foreground
OptionPane.messageForeground = @foreground

# ---- Checkboxes / radio buttons ----
CheckBox.background         = @background
CheckBox.foreground         = @foreground
CheckBox.icon.background    = @elevatedBackground
CheckBox.icon.borderColor   = @borderColor
CheckBox.icon.selectedBackground = @accentColor
CheckBox.icon.selectedBorderColor = @accentColor
CheckBox.icon.checkmarkColor = #FFFFFF
CheckBox.icon.focusedBorderColor = @accentColor
CheckBox.icon.hoverBorderColor = @accentFocusColor

RadioButton.background      = @background
RadioButton.foreground      = @foreground
RadioButton.icon.background = @elevatedBackground
RadioButton.icon.borderColor = @borderColor
RadioButton.icon.selectedBackground = @accentColor
RadioButton.icon.selectedBorderColor = @accentColor
RadioButton.icon.centerDiameter = 6

# ---- File chooser ----
FileChooser.background      = @background
FileChooser.foreground      = @foreground

# ---- Slider ----
Slider.background           = @background
Slider.foreground           = @foreground
Slider.trackColor           = @borderColor
Slider.thumbColor           = @accentColor
Slider.tickColor            = @disabledForeground

# =============================================================================
# Custom keys consumed by autoMATE TaskCanvas / dialogs.
# Read via UIManager.getColor("Mira.<name>") with sensible fallbacks in code.
# =============================================================================
Mira.canvas.background      = @background
Mira.canvas.grid            = #2A2C30
Mira.canvas.gridMajor       = #34373C
Mira.captionForeground      = #6FA8FF
Mira.node.background        = @panelBackground
Mira.node.altRow            = #232529
Mira.node.border            = @borderColor
Mira.node.selectedBorder    = @accentColor
Mira.node.title             = @foreground
Mira.node.disabled          = #3A3D42
Mira.node.error             = @errorColor
Mira.node.running           = @accentFocusColor
Mira.node.success           = @successColor
Mira.port.input             = #5CB85C
Mira.port.output            = @accentFocusColor
Mira.edge.default           = #6F7378
Mira.edge.selected          = @accentColor
Mira.edge.error             = @errorColor
Mira.taskKind.hover         = @hoverBackground
Mira.taskKind.selected      = @selectionBackground
Mira.taskKind.selectedText  = @selectionForeground
Mira.taskKind.category      = @disabledForeground
Mira.placeholder.foreground = @disabledForeground
